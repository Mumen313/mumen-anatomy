name: Fetch public-domain plates
# Manual helper: downloads Wikimedia Commons files (public domain) into games/plates-src/
on:
  workflow_dispatch:
    inputs:
      names:
        description: Space-separated Commons file names, e.g. "Gray378.png Gray409.png"
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        env:
          NAMES: ${{ inputs.names }}
        run: |
          mkdir -p games/plates-src
          for n in $NAMES; do
            case "$n" in
              http*) out="games/plates-src/$(echo "$n" | sed 's#^https\?://##; s#[^A-Za-z0-9._-]#_#g' | tail -c 120)"; url="$n" ;;
              *) out="games/plates-src/$n"; url="https://commons.wikimedia.org/wiki/Special:FilePath/$n" ;;
            esac
            curl -sSfL -A "MumenAnatomyBot/1.0 (https://mumen313.github.io/mumen-anatomy/)" -o "$out" "$url" || echo "::warning::failed $n"
            sleep 1
          done
          python3 -m pip install -q pillow
          python3 - <<'PY'
          import glob, os
          from PIL import Image
          Image.MAX_IMAGE_PIXELS = None
          for f in glob.glob('games/plates-src/*'):
              if not f.lower().endswith(('.png', '.jpg', '.jpeg')) or f.endswith('.src.jpg'):
                  continue
              try:
                  im = Image.open(f).convert('RGB')
              except Exception as e:
                  print('skip', f, e); continue
              if im.width > 2000:
                  im = im.resize((2000, round(im.height * 2000 / im.width)), Image.LANCZOS)
              out = os.path.splitext(f)[0] + '.src.jpg'
              im.save(out, quality=90)
              os.remove(f)
              print(out, im.size)
          PY
          ls -la games/plates-src
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -f games/plates-src
          git commit -m "Fetch plates: $(echo ${{ inputs.names }} | head -c 200) [skip ci]" || echo nothing
          git push
