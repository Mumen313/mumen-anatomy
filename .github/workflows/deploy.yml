name: Build website from Notion

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # "Run workflow" button = update the website now
  repository_dispatch:
    types: [notion-update]       # lets Claude trigger an update
  schedule:
    - cron: "17 */3 * * *"       # every 3 hours: picks up whatever you changed in Notion

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Reuse downloaded images
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ github.run_id }}
          restore-keys: media-
      - name: Build site from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
