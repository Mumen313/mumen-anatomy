<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cadaver Atlas · Mumen Anatomy</title>
<style>
:root{--bg:#14110f;--card:#1f1b18;--card2:#2a2420;--ink:#f3ece4;--mut:#b5a99c;--gold:#d8a94a;--bad:#d9534f;--line:#3a322c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:22px 16px}
a{color:var(--gold)}
.lock{max-width:420px;margin:9vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;text-align:center}
.lock h1{margin:6px 0 4px;color:var(--gold);font-size:26px}
.lock p{color:var(--mut);margin:0 0 18px;font-size:15px}
.lock input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-size:18px;text-align:center}
.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer}
.gold{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:600}
.err{color:var(--bad);min-height:22px;margin-top:8px;font-size:15px}
label.rem{display:flex;gap:8px;justify-content:center;align-items:center;color:var(--mut);font-size:15px;margin:12px 0}
.topics{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:16px}
.topic{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer}
.topic b{display:block;font-size:18px;margin-bottom:4px}
.topic span{color:var(--mut);font-size:14px}
.bar{position:fixed;inset:0 0 auto 0;height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:#0d0b0a;border-bottom:1px solid var(--line);z-index:2}
.bar b{color:var(--gold)}
#frame{position:fixed;top:52px;left:0;right:0;bottom:0;width:100%;height:calc(100% - 52px);border:0;background:var(--bg)}
.hidden{display:none!important}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
</style>
</head>
<body>
<div class="wrap" id="lockView">
  <div class="lock" id="gate"></div>
  <p style="text-align:center;margin-top:14px"><a href="__BASE__">‹ Back to Mumen Anatomy</a></p>
</div>
<div class="wrap hidden" id="menuView">
  <div class="top"><h1 style="margin:0;color:var(--gold)">Cadaver Atlas</h1><span class="spacer"></span><a href="__BASE__">Website</a><button class="btn" id="lockBtn">🔒 Lock</button></div>
  <p style="color:var(--mut)">Clip-test games from the photographic atlas – pick a topic.</p>
  <div class="topics" id="topics"></div>
</div>
<div class="hidden" id="playView">
  <div class="bar"><button class="btn" id="back" style="min-height:38px;padding:6px 12px">‹ Topics</button><b id="ptitle"></b></div>
  <iframe id="frame" title="Clip test game"></iframe>
</div>
<script src="__BASE__assets/access-gate.js"></script>
<script>
const TEMPLATE = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<title>Clip Test \u00b7 __TITLE__<\/title>\n<style>\n:root{--bg:#14110f;--card:#1f1b18;--card2:#2a2420;--ink:#f3ece4;--mut:#b5a99c;--gold:#d8a94a;--ok:#3fae6a;--bad:#d9534f;--line:#3a322c}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nhtml,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,sans-serif}\nbutton{font:inherit;color:inherit;cursor:pointer}\n.wrap{max-width:1400px;margin:0 auto;padding:14px 16px calc(24px + env(safe-area-inset-bottom))}\nheader{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}\nheader h1{font-size:20px;margin:0;color:var(--gold);letter-spacing:.3px}\nheader .sub{color:var(--mut);font-size:14px}\n.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;color:var(--mut)}\n.pill b{color:var(--ink)}\n.spacer{flex:1}\n.btn{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 16px;min-height:48px}\n.btn.gold{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:600}\n.btn.small{padding:6px 12px;min-height:38px;font-size:15px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}\n/* start */\n.grid2{display:grid;gap:14px;grid-template-columns:1fr}\n@media(min-width:820px){.grid2{grid-template-columns:1fr 1fr}}\n.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}\n.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:9px 15px;min-height:44px}\n.chip.on{background:var(--gold);color:#1b1408;border-color:var(--gold);font-weight:600}\nh2{font-size:17px;margin:0 0 4px}\np.m{color:var(--mut);margin:4px 0 10px;font-size:15px}\n/* quiz */\n.quiz{display:grid;gap:14px;grid-template-columns:1fr}\n@media(min-width:900px){.quiz{grid-template-columns:minmax(0,1.35fr) minmax(340px,1fr);align-items:start}}\n.imgbox{position:relative;background:#000;border-radius:16px;overflow:hidden;border:1px solid var(--line)}\n.scroller{overflow:auto;max-height:72vh;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}\n.scroller img{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none}\n.zoombar{position:absolute;right:10px;top:10px;display:flex;gap:6px}\n.zoombar button{width:44px;height:44px;border-radius:12px;border:1px solid #0006;background:#000a;color:#fff;font-size:22px}\n.capline{color:var(--mut);font-size:14px;padding:8px 12px;background:#0008}\n.qnum{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:64px;padding:0 10px;border-radius:18px;background:var(--gold);color:#1b1408;font-size:34px;font-weight:800}\n.qhead{display:flex;gap:14px;align-items:center;margin-bottom:12px}\n.qhead .t{font-size:15px;color:var(--mut)}\n.qhead .t b{color:var(--ink);font-size:19px;display:block}\n.answers{display:grid;gap:10px}\n.ans{text-align:left;background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;min-height:58px}\n.ans .la{font-weight:650;font-size:17px}\n.ans .en{color:var(--mut);font-size:14px}\n.ans.ok{border-color:var(--ok);background:#1d3527}\n.ans.bad{border-color:var(--bad);background:#3a1f1e}\n.ans:disabled{opacity:1}\n.hint{margin-top:10px;background:#2b2416;border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:15px}\n.fb{margin-top:12px;border-radius:14px;padding:12px 14px;border:1.5px solid var(--line)}\n.fb.ok{border-color:var(--ok);background:#173023}\n.fb.bad{border-color:var(--bad);background:#33191a}\n.fb .head{font-weight:700;font-size:18px;margin-bottom:4px}\n.fb .big{font-size:20px;font-weight:700;color:#fff}\n.fb .en{color:var(--mut)}\n.lm{margin-top:8px;padding:9px 11px;border-radius:10px;background:#00000040;border-left:4px solid var(--gold)}\n.lm b{color:var(--gold)}\n.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}\n.progress{height:6px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0 12px}\n.progress i{display:block;height:100%;background:var(--gold);width:0}\n/* legend list */\n.legend{margin-top:10px;display:grid;gap:6px}\n.lg{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}\n.lg .n{min-width:34px;height:34px;border-radius:10px;background:#3a3026;color:var(--gold);display:flex;align-items:center;justify-content:center;font-weight:800}\n.lg .txt{flex:1}\n.lg .cover{color:var(--mut);font-style:italic}\n.lg .cue{color:var(--mut);font-size:14px;margin-top:3px}\n.lg.cur{border-color:var(--gold)}\n.missed{display:grid;gap:8px;margin-top:10px}\n.big-score{font-size:46px;font-weight:800;color:var(--gold)}\n.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:18px}\n.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}\n.thumbs button{padding:0;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:#000;position:relative}\n.thumbs button.on{border-color:var(--gold)}\n.thumbs img{width:100%;height:90px;object-fit:cover;display:block}\n.thumbs span{position:absolute;left:4px;bottom:4px;background:#000b;border-radius:6px;padding:1px 6px;font-size:12px}\n.hidden{display:none!important}\n<\/style>\n<\/head>\n<body>\n<div class=\"wrap\">\n  <header>\n    <h1>Clip Test \u00b7 __TITLE__<\/h1>\n    <span class=\"sub\" id=\"hdrsub\"><\/span>\n    <span class=\"spacer\"><\/span>\n    <span class=\"pill hidden\" id=\"scorePill\">\u2705 <b id=\"sOk\">0<\/b> \u00b7 \u274c <b id=\"sBad\">0<\/b> \u00b7 \ud83d\udd25 <b id=\"sStreak\">0<\/b><\/span>\n    <button class=\"btn small hidden\" id=\"homeBtn\">\u2630 Menu<\/button>\n  <\/header>\n\n  <!-- START -->\n  <section id=\"start\">\n    <div class=\"grid2\">\n      <div class=\"card\">\n        <h2>How do you want to practise?<\/h2>\n        <div class=\"opt-row\" id=\"modeChips\">\n          <button class=\"chip on\" data-v=\"mc\">\ud83c\udfaf Multiple choice<\/button>\n          <button class=\"chip\" data-v=\"clip\">\ud83d\udde3\ufe0f Clip-test (say it \u2192 reveal)<\/button>\n          <button class=\"chip\" data-v=\"study\">\ud83d\udcd6 Study photos<\/button>\n        <\/div>\n        <p class=\"m\" id=\"modeDesc\"><\/p>\n        <div id=\"quizOpts\">\n          <h2>Questions<\/h2>\n          <div class=\"opt-row\" id=\"countChips\">\n            <button class=\"chip\" data-v=\"15\">15<\/button>\n            <button class=\"chip on\" data-v=\"30\">30<\/button>\n            <button class=\"chip\" data-v=\"60\">60<\/button>\n            <button class=\"chip\" data-v=\"9999\">All<\/button>\n          <\/div>\n          <h2>Order<\/h2>\n          <div class=\"opt-row\" id=\"orderChips\">\n            <button class=\"chip on\" data-v=\"mix\">\ud83d\udd00 Mixed photos<\/button>\n            <button class=\"chip\" data-v=\"photo\">\ud83d\uddbc\ufe0f Photo by photo<\/button>\n          <\/div>\n          <h2>Answer choices from<\/h2>\n          <div class=\"opt-row\" id=\"distChips\">\n            <button class=\"chip on\" data-v=\"same\">Same photo (harder)<\/button>\n            <button class=\"chip\" data-v=\"topic\">Whole topic<\/button>\n          <\/div>\n        <\/div>\n        <button class=\"btn gold\" id=\"goBtn\" style=\"width:100%\">Start \u25b6<\/button>\n      <\/div>\n      <div class=\"card\">\n        <h2>Photos in this topic<\/h2>\n        <p class=\"m\">Tap photos to include only those (none selected = all). <span id=\"selInfo\"><\/span><\/p>\n        <div class=\"row\" style=\"margin-top:0\"><button class=\"btn small\" id=\"selAll\">Select all<\/button><button class=\"btn small\" id=\"selNone\">Clear<\/button><\/div>\n        <div class=\"thumbs\" id=\"thumbs\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- QUIZ -->\n  <section id=\"quiz\" class=\"hidden\">\n    <div class=\"progress\"><i id=\"prog\"><\/i><\/div>\n    <div class=\"quiz\">\n      <div class=\"imgbox\">\n        <div class=\"scroller\" id=\"scroller\"><img id=\"qimg\" alt=\"atlas photo\"><\/div>\n        <div class=\"zoombar\"><button id=\"zIn\">\uff0b<\/button><button id=\"zOut\">\uff0d<\/button><\/div>\n        <div class=\"capline\" id=\"qcap\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"qhead\"><div class=\"qnum\" id=\"qn\">?<\/div><div class=\"t\">Find this number on the photo<b id=\"qtitle\">What is structure ?<\/b><\/div><\/div>\n        <div class=\"answers\" id=\"answers\"><\/div>\n        <div id=\"clipBox\" class=\"hidden\">\n          <p class=\"m\">Say the Latin name out loud (like in the Kolloquium), then reveal.<\/p>\n          <button class=\"btn gold\" id=\"revealBtn\" style=\"width:100%\">\ud83d\udc41\ufe0f Reveal answer<\/button>\n          <div class=\"row hidden\" id=\"selfRow\">\n            <button class=\"btn\" id=\"knewBtn\" style=\"flex:1;border-color:var(--ok)\">\u2705 I knew it<\/button>\n            <button class=\"btn\" id=\"nearBtn\" style=\"flex:1;border-color:var(--gold)\">\ud83e\udd0f Almost<\/button>\n            <button class=\"btn\" id=\"missBtn\" style=\"flex:1;border-color:var(--bad)\">\u274c Didn't know<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"row\"><button class=\"btn small\" id=\"hintBtn\">\ud83d\udccd Landmark hint<\/button><button class=\"btn small\" id=\"legendBtn\">\ud83d\uddc2\ufe0f All labels on this photo<\/button><\/div>\n        <div class=\"hint hidden\" id=\"hint\"><\/div>\n        <div id=\"fb\"><\/div>\n        <div class=\"legend hidden\" id=\"legend\"><\/div>\n        <div class=\"row\"><button class=\"btn gold hidden\" id=\"nextBtn\" style=\"flex:1\">Next \u25b6<\/button><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- STUDY -->\n  <section id=\"study\" class=\"hidden\">\n    <div class=\"quiz\">\n      <div class=\"imgbox\">\n        <div class=\"scroller\" id=\"sScroller\"><img id=\"simg\" alt=\"atlas photo\"><\/div>\n        <div class=\"zoombar\"><button id=\"szIn\">\uff0b<\/button><button id=\"szOut\">\uff0d<\/button><\/div>\n        <div class=\"capline\" id=\"scap\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <div class=\"row\" style=\"margin-top:0;align-items:center\">\n          <button class=\"btn small\" id=\"sPrev\">\u25c0 Prev<\/button>\n          <span class=\"pill\" id=\"sPos\"><\/span>\n          <button class=\"btn small\" id=\"sNext\">Next \u25b6<\/button>\n          <span class=\"spacer\"><\/span>\n          <button class=\"btn small\" id=\"sToggle\">Show all<\/button>\n        <\/div>\n        <p class=\"m\">Tap a number to reveal the name + landmark. Test yourself first!<\/p>\n        <div class=\"legend\" id=\"sLegend\"><\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- END -->\n  <section id=\"end\" class=\"hidden\">\n    <div class=\"card\" style=\"text-align:center\">\n      <div id=\"endMsg\" style=\"font-size:20px;margin-bottom:6px\"><\/div>\n      <div class=\"big-score\" id=\"endScore\"><\/div>\n      <div class=\"row\" style=\"justify-content:center\">\n        <button class=\"btn gold\" id=\"againMissed\">\ud83d\udd01 Practise my mistakes<\/button>\n        <button class=\"btn\" id=\"againAll\">New round<\/button>\n        <button class=\"btn\" id=\"toMenu\">Menu<\/button>\n      <\/div>\n    <\/div>\n    <div class=\"card\" style=\"margin-top:14px\"><h2>Your mistakes \u2013 with landmarks<\/h2><div class=\"missed\" id=\"missedList\"><\/div><\/div>\n  <\/section>\n  <div class=\"foot\">Private study tool for Mumen Uthman \u00b7 photos & legends from the Photographic Atlas of Anatomy (your scan) \u00b7 landmark tips are study aids \u2014 check with your textbook.<\/div>\n<\/div>\n\n<script>\nconst DATA = __DATA__;\nconst IMG = __IMG__;\nconst $ = id => document.getElementById(id);\nconst items = DATA.items;\nlet sel = new Set();          // selected photo indexes\nlet opt = {mode:'mc', count:30, order:'mix', dist:'same'};\nlet queue=[], qi=0, total=0, ok=0, bad=0, streak=0, missed=[], cur=null, answered=false, hinted=false;\nconst PRAISE_OK=['Alhamdulillah! \u2705','Alhamdulillah \u2013 correct! \u2705','MashaAllah, spot on! \u2705'];\nconst PRAISE_BAD=['Astaghfirullah \u2013 not this one \u274c','Allahu akbar \u2013 keep going \u274c'];\nconst pick = a => a[Math.floor(Math.random()*a.length)];\nconst shuffle = a => {for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};\nconst esc = s => String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n\nfunction chips(id,key){ $(id).querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ $(id).querySelectorAll('.chip').forEach(x=>x.classList.remove('on')); b.classList.add('on'); opt[key]= isNaN(+b.dataset.v)?b.dataset.v:+b.dataset.v; if(key==='mode') modeUI(); }); }\nfunction modeUI(){\n  const d={mc:'Pick the right Latin name from 4 options. Wrong answers come back later in the round.',\n           clip:'Like the real clip test: look at the number, say the Latin name, then reveal and grade yourself honestly.',\n           study:'Browse each photo with its numbered legend. Names stay hidden until you tap them.'};\n  $('modeDesc').textContent=d[opt.mode];\n  $('quizOpts').classList.toggle('hidden',opt.mode==='study');\n}\nfunction buildThumbs(){\n  const t=$('thumbs'); t.innerHTML='';\n  items.forEach((it,i)=>{const b=document.createElement('button'); b.innerHTML=`<img src=\"${IMG[it.p]}\" loading=\"lazy\"><span>${it.ents.length} labels<\/span>`;\n    b.onclick=()=>{sel.has(i)?sel.delete(i):sel.add(i); b.classList.toggle('on'); selInfo();}; t.appendChild(b);});\n  selInfo();\n}\nfunction selInfo(){ $('selInfo').textContent = sel.size? `${sel.size} selected.`:'All photos.'; }\n$('selAll').onclick=()=>{items.forEach((_,i)=>sel.add(i)); document.querySelectorAll('#thumbs button').forEach(b=>b.classList.add('on')); selInfo();};\n$('selNone').onclick=()=>{sel.clear(); document.querySelectorAll('#thumbs button').forEach(b=>b.classList.remove('on')); selInfo();};\nfunction activeIdx(){ return sel.size? [...sel].sort((a,b)=>a-b) : items.map((_,i)=>i); }\n\nfunction show(id){ ['start','quiz','study','end'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); $('homeBtn').classList.toggle('hidden',id==='start'); $('scorePill').classList.toggle('hidden',!(id==='quiz'||id==='end')); window.scrollTo(0,0); }\n\n// zoom\nfunction zoomer(sc,img,inB,outB){ let z=1; const set=()=>{img.style.width=(z*100)+'%';}; $(inB).onclick=()=>{z=Math.min(4,z+0.5);set();}; $(outB).onclick=()=>{z=Math.max(1,z-0.5);set();}; return ()=>{z=1;set();sc.scrollTo(0,0);}; }\nconst resetQZ = zoomer($('scroller'),$('qimg'),'zIn','zOut');\nconst resetSZ = zoomer($('sScroller'),$('simg'),'szIn','szOut');\n\nfunction start(list){\n  ok=bad=streak=0; missed=[]; qi=0;\n  if(list){ queue=list.map(q=>({...q})); }\n  else{\n    const idx=activeIdx(); let qs=[];\n    idx.forEach(i=>items[i].ents.forEach((e,k)=>qs.push({i,k})));\n    if(opt.order==='mix'){ shuffle(qs); }\n    else { const byPhoto=shuffle(idx.slice()); qs=[]; byPhoto.forEach(i=>shuffle(items[i].ents.map((e,k)=>({i,k}))).forEach(q=>qs.push(q))); }\n    queue=qs.slice(0,opt.count);\n  }\n  total=queue.length; upd(); show('quiz'); ask();\n}\nfunction upd(){ $('sOk').textContent=ok; $('sBad').textContent=bad; $('sStreak').textContent=streak; $('prog').style.width=(total?Math.min(100,qi/total*100):0)+'%'; $('hdrsub').textContent= total? `Question ${Math.min(qi+1,total)} / ${total}`:''; }\nfunction ask(){\n  if(qi>=queue.length) return finish();\n  cur=queue[qi]; answered=false; hinted=false;\n  const it=items[cur.i], e=it.ents[cur.k];\n  if($('qimg').dataset.p!=String(it.p)){ $('qimg').src=IMG[it.p]; $('qimg').dataset.p=it.p; resetQZ(); }\n  $('qcap').textContent = it.cap || DATA.title;\n  $('qn').textContent=e.n; $('qtitle').textContent=`What is structure ${e.n}?`;\n  $('hint').classList.add('hidden'); $('fb').innerHTML=''; $('legend').classList.add('hidden'); $('nextBtn').classList.add('hidden');\n  $('hintBtn').disabled=false;\n  const A=$('answers'); A.innerHTML='';\n  if(opt.mode==='clip'){ A.classList.add('hidden'); $('clipBox').classList.remove('hidden'); $('revealBtn').classList.remove('hidden'); $('selfRow').classList.add('hidden'); }\n  else{\n    A.classList.remove('hidden'); $('clipBox').classList.add('hidden');\n    const opts=[e]; const seen=new Set([e.la]);\n    let pool = opt.dist==='same'? it.ents.filter(x=>!seen.has(x.la)) : [];\n    if(pool.length<3){ items.forEach(o=>o.ents.forEach(x=>{ if(!seen.has(x.la)) pool.push(x); })); }\n    shuffle(pool); for(const x of pool){ if(opts.length>=4) break; if(!seen.has(x.la)){ opts.push(x); seen.add(x.la);} }\n    shuffle(opts).forEach(o=>{ const b=document.createElement('button'); b.className='ans'; b.innerHTML=`<div class=\"la\">${esc(o.la)}<\/div>${o.en?`<div class=\"en\">${esc(o.en)}<\/div>`:''}`; b.onclick=()=>choose(b,o,e); A.appendChild(b); });\n  }\n  upd();\n}\nfunction lmHTML(e){ return e.cue? `<div class=\"lm\"><b>\ud83d\udccd Landmark:<\/b> ${esc(e.cue)}<\/div>`:''; }\nfunction feedback(good,e,txt){\n  $('fb').innerHTML=`<div class=\"fb ${good?'ok':'bad'}\"><div class=\"head\">${txt}<\/div><div class=\"big\">${e.n}. ${esc(e.la)}<\/div>${e.en?`<div class=\"en\">${esc(e.en)}<\/div>`:''}${lmHTML(e)}<\/div>`;\n  $('nextBtn').classList.remove('hidden'); $('hintBtn').disabled=true; $('hint').classList.add('hidden');\n  if(!$('legend').classList.contains('hidden')) renderLegend();\n}\nfunction record(good){\n  answered=true;\n  if(good){ ok++; streak++; }\n  else{ bad++; streak=0; if(!missed.some(m=>m.i===cur.i&&m.k===cur.k)) missed.push({i:cur.i,k:cur.k});\n        if(!cur.requeued){ const again={...cur,requeued:true}; queue.splice(Math.min(queue.length,qi+4),0,again); total=queue.length; } }\n  upd();\n}\nfunction choose(btn,o,e){\n  if(answered) return;\n  const good=o.la===e.la;\n  document.querySelectorAll('#answers .ans').forEach(b=>{ b.disabled=true; if(b.querySelector('.la').textContent===e.la) b.classList.add('ok'); });\n  if(!good) btn.classList.add('bad');\n  record(good);\n  feedback(good,e, good? pick(PRAISE_OK)+(streak>=5?` \ud83d\udd25 ${streak} in a row`:'') : pick(PRAISE_BAD));\n}\n$('revealBtn').onclick=()=>{ const e=items[cur.i].ents[cur.k]; $('revealBtn').classList.add('hidden'); $('selfRow').classList.remove('hidden');\n  $('fb').innerHTML=`<div class=\"fb\"><div class=\"big\">${e.n}. ${esc(e.la)}<\/div>${e.en?`<div class=\"en\">${esc(e.en)}<\/div>`:''}${lmHTML(e)}<\/div>`; $('hintBtn').disabled=true; };\nfunction selfGrade(kind){ if(answered) return; const e=items[cur.i].ents[cur.k]; $('selfRow').classList.add('hidden');\n  record(kind==='knew'); feedback(kind==='knew',e, kind==='knew'?pick(PRAISE_OK):kind==='near'?'SubhanAllah \u2013 almost! It will come back \ud83e\udd0f':pick(PRAISE_BAD)); }\n$('knewBtn').onclick=()=>selfGrade('knew'); $('nearBtn').onclick=()=>selfGrade('near'); $('missBtn').onclick=()=>selfGrade('miss');\n$('hintBtn').onclick=()=>{ const e=items[cur.i].ents[cur.k]; hinted=true; $('hint').innerHTML= e.cue? `<b>\ud83d\udccd Landmark hint:<\/b> ${esc(e.cue.replace(/^Tendon of this muscle\\. /,'Tendon. '))}` : 'No landmark tip for this one \u2013 look at the neighbouring labels.'; $('hint').classList.remove('hidden'); };\n$('legendBtn').onclick=()=>{ const L=$('legend'); if(L.classList.contains('hidden')){ renderLegend(); L.classList.remove('hidden'); } else L.classList.add('hidden'); };\nfunction renderLegend(){\n  const it=items[cur.i], e=it.ents[cur.k];\n  $('legend').innerHTML = it.ents.map(x=>{ const hide = !answered && x.la===e.la;\n    return `<div class=\"lg ${x.la===e.la?'cur':''}\"><div class=\"n\">${x.n}<\/div><div class=\"txt\">${hide?'<span class=\"cover\">\u2014 the asked structure \u2014<\/span>':`<b>${esc(x.la)}<\/b>${x.en?` <span style=\"color:var(--mut)\">\u00b7 ${esc(x.en)}<\/span>`:''}${x.cue?`<div class=\"cue\">\ud83d\udccd ${esc(x.cue)}<\/div>`:''}`}<\/div><\/div>`; }).join('');\n}\n$('nextBtn').onclick=()=>{ qi++; ask(); };\nfunction finish(){\n  const pct= ok+bad? Math.round(ok/(ok+bad)*100):0;\n  $('endScore').textContent=pct+'%';\n  $('endMsg').textContent = pct>=85?'MashaAllah \u2013 Kolloquium ready! \ud83c\udf1f': pct>=60?'Alhamdulillah, good progress \ud83d\udcaa':'Keep going \u2013 every round sticks a bit more \ud83d\udcda';\n  $('missedList').innerHTML = missed.length? missed.map(m=>{const it=items[m.i],e=it.ents[m.k]; return `<div class=\"lg\"><img src=\"${IMG[it.p]}\" style=\"width:86px;height:64px;object-fit:cover;border-radius:8px\"><div class=\"txt\"><b>#${e.n} \u00b7 ${esc(e.la)}<\/b>${e.en?` <span style=\"color:var(--mut)\">\u00b7 ${esc(e.en)}<\/span>`:''}${e.cue?`<div class=\"cue\">\ud83d\udccd ${esc(e.cue)}<\/div>`:''}<\/div><\/div>`;}).join('') : '<p class=\"m\">No mistakes \u2013 Alhamdulillah! \ud83c\udf89<\/p>';\n  $('againMissed').classList.toggle('hidden',!missed.length);\n  qi=total; upd(); show('end');\n}\n$('againMissed').onclick=()=>start(shuffle(missed.slice()));\n$('againAll').onclick=()=>start();\nconst menu=()=>{show('start'); $('hdrsub').textContent=`${items.length} photos \u00b7 ${nq} structures`;}; $('toMenu').onclick=menu; $('homeBtn').onclick=menu;\n\n// study\nlet sPos=0, sList=[], sOpen=new Set();\nfunction study(){ sList=activeIdx(); sPos=0; show('study'); $('hdrsub').textContent='Study mode'; sRender(); }\nfunction sRender(){\n  const it=items[sList[sPos]]; sOpen=new Set(); $('simg').src=IMG[it.p]; resetSZ(); $('scap').textContent=it.cap||DATA.title;\n  $('sPos').textContent=`${sPos+1} / ${sList.length}`; $('sToggle').textContent='Show all'; sLegend();\n}\nfunction sLegend(){\n  const it=items[sList[sPos]];\n  $('sLegend').innerHTML=it.ents.map((x,k)=>`<button class=\"lg\" style=\"text-align:left;width:100%\" data-k=\"${k}\"><div class=\"n\">${x.n}<\/div><div class=\"txt\">${sOpen.has(k)?`<b>${esc(x.la)}<\/b>${x.en?` <span style=\"color:var(--mut)\">\u00b7 ${esc(x.en)}<\/span>`:''}${x.cue?`<div class=\"cue\">\ud83d\udccd ${esc(x.cue)}<\/div>`:''}`:'<span class=\"cover\">tap to reveal\u2026<\/span>'}<\/div><\/button>`).join('');\n  $('sLegend').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=+b.dataset.k; sOpen.has(k)?sOpen.delete(k):sOpen.add(k); sLegend();});\n}\n$('sPrev').onclick=()=>{ sPos=(sPos-1+sList.length)%sList.length; sRender(); };\n$('sNext').onclick=()=>{ sPos=(sPos+1)%sList.length; sRender(); };\n$('sToggle').onclick=()=>{ const it=items[sList[sPos]]; if(sOpen.size<it.ents.length){ it.ents.forEach((_,k)=>sOpen.add(k)); $('sToggle').textContent='Hide all'; } else { sOpen.clear(); $('sToggle').textContent='Show all'; } sLegend(); };\n\n$('goBtn').onclick=()=> opt.mode==='study'? study() : start();\nchips('modeChips','mode'); chips('countChips','count'); chips('orderChips','order'); chips('distChips','dist');\nmodeUI(); buildThumbs();\nvar nq=items.reduce((s,i)=>s+i.ents.length,0);\n$('hdrsub').textContent=`${items.length} photos \u00b7 ${nq} structures`;\n<\/script>\n<\/body>\n<\/html>\n";
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const ub64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
let KEY=null, INDEX=[], cache={}, blobUrl=null;
async function getBin(f){ const r=await fetch(f,{cache:'no-cache'}); if(!r.ok) throw new Error('missing '+f); return new Uint8Array(await r.arrayBuffer()); }
async function dec(buf){ const iv=buf.slice(0,12); return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv},KEY,buf.slice(12))); }
async function deriveKey(pw){
  const m=await (await fetch('manifest.json',{cache:'no-cache'})).json();
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(m.salt),iterations:m.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function openWith(key){
  KEY=key;
  const ok=new TextDecoder().decode(await dec(await getBin('check.bin')));
  if(ok!=='MUMEN-ATLAS-OK') throw new Error('bad');
  INDEX=JSON.parse(new TextDecoder().decode(await dec(await getBin('index.bin'))));
  menu();
}
function menu(){
  $('lockView').classList.add('hidden'); $('playView').classList.add('hidden'); $('menuView').classList.remove('hidden');
  $('topics').innerHTML=INDEX.map((t,i)=>`<button class="topic" data-i="${i}"><b>${t.title}</b><span>${t.photos} photos · ${t.q} structures</span></button>`).join('');
  $('topics').querySelectorAll('.topic').forEach(b=>b.onclick=()=>play(+b.dataset.i));
}
async function play(i){
  const t=INDEX[i]; const btn=$('topics').children[i]; const old=btn.innerHTML; btn.innerHTML=`<b>${t.title}</b><span>Unlocking…</span>`;
  try{
    if(!cache[t.file]) cache[t.file]=JSON.parse(new TextDecoder().decode(await dec(await getBin(t.file))));
    const d=cache[t.file];
    const html=TEMPLATE.replace(/__TITLE__/g,()=>d.title).replace('__DATA__',()=>JSON.stringify({title:d.title,items:d.items})).replace('__IMG__',()=>JSON.stringify(d.img));
    if(blobUrl) URL.revokeObjectURL(blobUrl);
    blobUrl=URL.createObjectURL(new Blob([html],{type:'text/html'}));
    $('frame').src=blobUrl; $('ptitle').textContent=d.title;
    $('menuView').classList.add('hidden'); $('playView').classList.remove('hidden');
  }catch(e){ alert('Could not open this topic: '+e.message); }
  btn.innerHTML=old;
}
$('back').onclick=()=>{ $('frame').src='about:blank'; menu(); };
const GATE=MumenGate.mount({el:$('gate'),game:'atlas',title:'Cadaver Atlas',storeKey:'mumenAtlasKey',onKey:openWith,masterDerive:deriveKey,mode:'owner'});
$('lockBtn').onclick=()=>{ KEY=null; cache={}; GATE.lock(); };
</script>
